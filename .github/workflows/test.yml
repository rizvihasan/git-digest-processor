# .github/workflows/test.yml

name: 'Test Processor Action'

on:
  push:
    branches:
      - develop

jobs:
  test-action:
    runs-on: ubuntu-latest
    steps:
      - name: 'Checkout Repo'
        uses: actions/checkout@v4

      - name: 'Run Local Action'
        id: local-action-test
        uses: ./ 
        with:
          repo_url: 'https://github.com/stedolan/jq.git'

      - name: 'Print Action Output'
        run: echo "The action output was ${{ steps.local-action-test.outputs.digest_artifact_name }}"