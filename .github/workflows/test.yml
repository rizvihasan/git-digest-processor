# .github/workflows/test.yml

name: 'Test and Run Processor Action'

on:
  # This keeps our original trigger, so it still runs on every push.
  push:
    branches:
      - develop

  # --- THIS IS THE FIX ---
  # This new trigger allows us to run this workflow from an API call.
  workflow_dispatch:
    # This defines the inputs the workflow can receive.
    inputs:
      repo_url:
        description: 'The URL of the repository to process'
        required: true
      job_id:
        description: 'The ID of the job record in our database'
        required: true

jobs:
  test-action:
    runs-on: ubuntu-latest
    steps:
      - name: 'Checkout Repo'
        uses: actions/checkout@v4

      - name: 'Setup Node.js'
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 'Install Dependencies'
        run: npm install

      - name: 'Build the Action'
        run: npm run build

      - name: 'Run Local Action'
        id: local-action-test
        uses: ./
        with:
          # This now gets the repo_url from the API call's input
          repo_url: ${{ github.event.inputs.repo_url }}
          # Note: We are not using the job_id input yet, but we will later.